<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>TE26 Steuerung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --frame:#000; --card:#fff; --ink:#000; --inv:#fff;
    --muted:rgba(255,255,255,.6); --line:rgba(255,255,255,.14); --pad:rgba(255,255,255,.08);
    --accent:#75C1F0; --accent-ink:#1f7fbf; --low:#ff5c5c; --stop:#ff4b3e;
    --r:22px; --font:"Figtree", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { background:var(--frame); color:var(--inv); font:15px/1.4 var(--font); overflow:hidden;
         padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
         user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .app { display:grid; grid-template-columns:minmax(170px, 22vw) 1fr minmax(170px, 22vw); gap:10px; height:100%; }
  .seite { display:flex; flex-direction:column; gap:10px; min-height:0; }
  #wrap { position:relative; background:var(--card); border-radius:var(--r); overflow:hidden; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #tut { position:absolute; left:12px; right:12px; top:10px; color:var(--ink); font-weight:500; font-size:15px;
         text-wrap:balance; pointer-events:none; }

  button { font:600 15px var(--font); border:none; border-radius:16px; color:var(--inv); background:var(--pad);
           cursor:pointer; transition:transform .1s ease-out, background .15s; touch-action:manipulation; }
  button:active { transform:scale(.95); background:rgba(255,255,255,.18); }
  button:disabled { opacity:.35; }
  button svg { width:22px; height:22px; fill:currentColor; display:block; margin:auto; }

  .kreuz { display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 1fr); gap:8px; flex:1; min-height:0; }
  .kreuz button { min-height:44px; }
  #k-f { grid-area:1/2; } #k-l { grid-area:2/1; } #k-r { grid-area:2/3; } #k-b { grid-area:3/2; }
  #k-s { grid-area:2/2; background:var(--stop); font-size:13px; letter-spacing:.04em; }
  .chips { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .chips button { padding:8px 0; font-size:13px; font-weight:500; }
  .chips button.an { background:var(--inv); color:var(--ink); }
  .klein { color:var(--muted); font-size:12px; }

  #verb { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:16px; background:var(--pad); text-align:left; }
  #verb i { width:9px; height:9px; border-radius:50%; background:var(--low); flex:none; }
  #verb.an i { background:#3ddc84; }
  #verb span { flex:1; font-weight:500; font-size:14px; }
  #akku { display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; font-size:14px; }
  .batt { width:26px; height:12px; fill:var(--inv); }
  .batt.leer #battlvl { fill:var(--low); }
  #go { flex:none; min-height:72px; font-size:18px; display:flex; align-items:center; justify-content:center; gap:10px;
        background:var(--inv); color:var(--ink); }
  #go.faehrt { background:var(--stop); color:var(--inv); }
  #go svg { width:16px; height:16px; margin:0; }
  #log { flex:1; overflow:auto; min-height:0; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:6px; }
  #log div { padding:3px 0; border-bottom:1px solid var(--line); }
  form { display:flex; gap:6px; }
  input { flex:1; min-width:0; font:15px var(--font); color:var(--inv); background:var(--pad); border:none; border-radius:12px; padding:9px 10px; }
  input:focus { outline:2px solid var(--accent); }
  form button { padding:0 12px; }

  #hoch { display:none; position:fixed; inset:0; background:var(--frame); place-items:center; text-align:center; padding:30px; font-size:18px; z-index:5; }
  @media (orientation:portrait) and (max-width:700px) { #hoch { display:grid; } }
  #kein { display:none; position:fixed; inset:0; background:var(--frame); place-items:center; text-align:center; padding:30px; z-index:6; }
  #kein p { max-width:520px; margin:0 auto; }
</style>
</head>
<body>
<div id="hoch"><div><svg viewBox="0 0 24 24" width="48" height="48" fill="#fff" aria-hidden="true"><path d="M16 1H8C6.3 1 5 2.3 5 4v16c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V4c0-1.7-1.3-3-3-3zm1 19c0 .6-.4 1-1 1H8c-.6 0-1-.4-1-1V4c0-.6.4-1 1-1h8c.6 0 1 .4 1 1v16z"/></svg><p>Handy quer drehen</p></div></div>
<div id="kein"><div><p style="font-size:20px;font-weight:600">Dieser Browser kann kein Bluetooth.</p>
  <p class="klein" style="font-size:15px">Android: in <b>Chrome</b> öffnen.<br>iPhone: in der App <b>Bluefy</b> (kostenlos im App Store) öffnen, Safari kann kein Web Bluetooth.</p></div></div>

<div class="app">
  <section class="seite" aria-label="Fahren">
    <div class="kreuz">
      <button id="k-f" aria-label="vorwärts"><svg viewBox="0 0 24 24"><path d="M12 4 4 14h5v6h6v-6h5z"/></svg></button>
      <button id="k-l" aria-label="links 90 Grad"><svg viewBox="0 0 24 24"><path d="M9 5 3 11l6 6v-4h6a4 4 0 0 1 4 4v2h2v-2a6 6 0 0 0-6-6H9z"/></svg></button>
      <button id="k-s" aria-label="Stopp">STOPP</button>
      <button id="k-r" aria-label="rechts 90 Grad"><svg viewBox="0 0 24 24"><path d="M15 5l6 6-6 6v-4H9a4 4 0 0 0-4 4v2H3v-2a6 6 0 0 1 6-6h6z"/></svg></button>
      <button id="k-b" aria-label="rückwärts"><svg viewBox="0 0 24 24"><path d="M12 20 4 10h5V4h6v6h5z"/></svg></button>
    </div>
    <div class="klein">Strecke</div>
    <div class="chips" id="weite">
      <button data-mm="50">5</button><button data-mm="100" class="an">10</button><button data-mm="180">18</button><button data-mm="300">30</button>
    </div>
    <div class="klein">cm · Drehen immer 90°</div>
  </section>

  <div id="wrap"><canvas id="c"></canvas><div id="tut">Nicht verbunden</div></div>

  <section class="seite" aria-label="Status und Labyrinth">
    <button id="verb"><i></i><span id="verbtxt">Verbinden</span><span id="akku"><svg class="batt" viewBox="0 0 28.901 13.2239" aria-hidden="true"><path d="M5.20687 13.2199L20.5548 13.2199C22.2235 13.2199 23.6198 13.0596 24.622 12.0698C25.6118 11.0676 25.7596 9.67552 25.7596 8.013L25.7596 5.20687C25.7596 3.54434 25.6118 2.15012 24.622 1.16038C23.6177 0.160283 22.2235 0 20.5548 0L5.18577 0C3.55067 0 2.14188 0.162393 1.14179 1.16249C0.149932 2.15434 0 3.54856 0 5.18366L0 8.013C0 9.67552 0.147822 11.0697 1.13968 12.0698C2.14188 13.0596 3.5361 13.2199 5.20687 13.2199ZM4.93695 11.6513C3.93656 11.6513 2.87758 11.5096 2.2877 10.9197C1.69781 10.3298 1.57069 9.28542 1.57069 8.28292L1.57069 4.9684C1.57069 3.93867 1.69781 2.89828 2.28559 2.29805C2.87547 1.70605 3.94078 1.57893 4.9684 1.57893L20.8248 1.57893C21.8251 1.57893 22.882 1.71027 23.4719 2.30016C24.0618 2.90039 24.191 3.93445 24.191 4.9473L24.191 8.28292C24.191 9.28542 24.0597 10.3298 23.4719 10.9197C22.882 11.5117 21.8251 11.6513 20.8248 11.6513ZM27.0951 9.13599C27.8652 9.08826 28.901 8.10022 28.901 6.60993C28.901 5.11964 27.8652 4.13161 27.0951 4.08388Z"/><path id="battlvl" d=""/></svg><b id="akkup">–</b></span></button>
    <button id="go" disabled><svg id="goico" viewBox="0 0 16 16"><path id="gopath" d="M3 1.5v13l11-6.5z"/></svg><span id="golbl">Labyrinth starten</span></button>
    <form id="frm" autocomplete="off"><input id="eing" placeholder="Befehl" enterkeyhint="send" autocapitalize="off"><button aria-label="senden">↵</button></form>
    <div id="log" aria-live="polite"></div>
  </section>
</div>

<script>
// ---------- Bluetooth (Nordic UART wie die Firmware) ----------
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let dev = null, rx = null, puffer = '', verbunden = false, warteschlange = Promise.resolve();
const $ = id => document.getElementById(id);
if (!navigator.bluetooth) $('kein').style.display = 'grid';

async function verbinden() {
  try {
    if (!dev) {
      dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'TE26' }], optionalServices: [NUS] });
      dev.addEventListener('gattserverdisconnected', getrennt);
    }
    status('Verbinde …');
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    tx.addEventListener('characteristicvaluechanged', e => empfang(new TextDecoder().decode(e.target.value)));
    await tx.startNotifications();
    verbunden = true; anzeigen(); meldung('verbunden');
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
  } catch (e) { status(e.name === 'NotFoundError' ? 'Nicht verbunden' : 'Fehler: ' + e.message); verbunden = false; anzeigen(); }
}
function getrennt() {
  verbunden = false; rx = null; anzeigen(); meldung('getrennt, verbinde neu …');
  setTimeout(() => { if (!verbunden && dev) verbinden(); }, 1000);
}
function senden(zeile) {                       // nacheinander schreiben, sonst lehnt der Browser parallele Schreibvorgänge ab
  if (!rx) return;
  warteschlange = warteschlange.then(() => rx.writeValue(new TextEncoder().encode(zeile.trim() + '\n'))).catch(e => meldung('Senden: ' + e.message));
}
function empfang(t) {
  puffer += t; let k;
  while ((k = puffer.indexOf('\n')) >= 0) { const z = puffer.slice(0, k); puffer = puffer.slice(k + 1); if (z.trim()) zeile(z); }
}

// ---------- Daten aus der Firmware (wie robo_bruecke.py) ----------
const D = { raster:null, map:null, pose:null, spur:[], weg:[], status:null, statusT:0, lauf:0, letzte:'' };
function zeile(z) {
  const k = z[0], rest = z.slice(2);
  try {
    if (z.startsWith('S {')) { D.status = JSON.parse(z.slice(2)); D.statusT = Date.now(); akku(D.status.v); return; }
    if (k === 'K') { const [x0, y0, res, nx, ny] = rest.split(' ').map(Number); Object.assign(D, { raster:{x0, y0, res, nx, ny}, map:null, pose:null, spur:[], weg:[], lauf:D.lauf + 1 }); return; }
    if (k === 'P') { const v = rest.split(' ').map(Number); D.pose = { x:v[0], y:v[1], th:v[2] / 1000, tof:v.slice(3, 8), t:Date.now() };
      const s = D.spur, l = s[s.length - 1]; if (!l || Math.abs(l[0] - v[0]) + Math.abs(l[1] - v[1]) > 8) s.push([v[0], v[1]]); return; }
    if (k === 'M') { const [i0, j0, w, h, b64] = rest.split(' '); D.map = { i0:+i0, j0:+j0, w:+w, h:+h, b64 }; return; }
    if (k === 'W') { D.weg = rest.split(' ').filter(Boolean).map(p => p.split(',').map(Number)); return; }
    if (k === 'Z' || k === 'C') return;
    if (k === 'N') { D.letzte = rest; }
  } catch (e) {}
  meldung(z.startsWith('N ') ? z.slice(2) : z);
}
function meldung(t) {
  const d = document.createElement('div'); d.textContent = t;
  $('log').prepend(d); while ($('log').children.length > 80) $('log').lastChild.remove();
}
function status(t) { $('tut').textContent = t; }

// ---------- Bedienung ----------
let weite = 100;
document.querySelectorAll('#weite button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#weite button').forEach(x => x.classList.remove('an')); b.classList.add('an'); weite = +b.dataset.mm; });
$('k-f').onclick = () => senden('f ' + weite);
$('k-b').onclick = () => senden('b ' + weite);
$('k-l').onclick = () => senden('l 90');
$('k-r').onclick = () => senden('r 90');
$('k-s').onclick = () => senden('s');
$('verb').onclick = () => { if (!verbunden) verbinden(); };
$('go').onclick = () => { if (faehrt()) senden('s'); else { Object.assign(D, { spur:[], weg:[], map:null, pose:null }); senden('go'); } };
$('frm').onsubmit = e => { e.preventDefault(); const v = $('eing').value.trim(); if (v) { senden(v); meldung('> ' + v); } $('eing').value = ''; $('eing').blur(); };
const faehrt = () => !!(D.pose && Date.now() - D.pose.t < 2000) && !/FERTIG|Gestoppt/.test(D.letzte);
function anzeigen() {
  $('verb').classList.toggle('an', verbunden);
  $('verbtxt').textContent = verbunden ? 'TE26' : 'Verbinden';
  document.querySelectorAll('.kreuz button, #go').forEach(b => b.disabled = !verbunden);
  const f = faehrt();
  $('go').classList.toggle('faehrt', f);
  $('golbl').textContent = f ? 'Stopp' : 'Labyrinth starten';
  $('gopath').setAttribute('d', f ? 'M2 2h12v12H2z' : 'M3 1.5v13l11-6.5z');
  if (!verbunden) { if (!/Fehler|Verbinde/.test($('tut').textContent)) status('Nicht verbunden. Oben rechts verbinden.'); }
  else status(f && D.letzte ? D.letzte : D.status && D.status.b ? 'fährt: ' + D.status.b : /FERTIG|Gestoppt/.test(D.letzte) ? D.letzte : 'Bereit');
}

// ---------- Karte (aus karte.html) ----------
const MOUNT = [[19,38.4,90],[32.2,32.2,45],[40.2,0,0],[32.2,-32.2,-45],[19,-38.4,-90]];
const HALF = 12.5 * Math.PI / 180;
const cv = $('c'), ctx = cv.getContext('2d');
let mapImg = null, mapKey = '';
const glatt = [null,null,null,null,null], zeige = [null,null,null,null,null], frei = [null,null,null,null,null], wechsel = [0,0,0,0,0];
let letzteT = null;
function beruhigt(k, mm) {
  const nichts = !(mm > 0 && mm < 8000);
  if (frei[k] === null) frei[k] = nichts;
  if (nichts !== frei[k]) { if (++wechsel[k] >= 3) { frei[k] = nichts; wechsel[k] = 0; if (nichts) glatt[k] = zeige[k] = null; } } else wechsel[k] = 0;
  if (frei[k]) return null;
  if (nichts) return zeige[k];
  glatt[k] = glatt[k] == null || Math.abs(mm - glatt[k]) > 60 ? mm : glatt[k] + 0.25 * (mm - glatt[k]);
  if (zeige[k] == null || Math.abs(glatt[k] - zeige[k]) >= 10) zeige[k] = Math.round(glatt[k] / 10) * 10;
  return glatt[k];
}
function decodeMap(m) {
  const bin = atob(m.b64), off = document.createElement('canvas'); off.width = m.w; off.height = m.h;
  const o = off.getContext('2d'), img = o.createImageData(m.w, m.h), col = { 1:[255,255,255], 2:[0,0,0], 3:[117,193,240] };
  for (let k = 0; k < m.w * m.h; k++) { const s = (bin.charCodeAt(k >> 2) >> ((k & 3) * 2)) & 3, c = col[s];
    if (c) { const p = k * 4; img.data[p] = c[0]; img.data[p+1] = c[1]; img.data[p+2] = c[2]; img.data[p+3] = 255; } }
  o.putImageData(img, 0, 0); return off;
}
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = W * dpr; cv.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#eceef0'; ctx.fillRect(0, 0, W, H);
  const r = D.raster;
  let xs = [-300, 600], ys = [-350, 350];
  if (r && D.map) { const m = D.map; xs.push(r.x0 + m.i0 * r.res, r.x0 + (m.i0 + m.w) * r.res); ys.push(r.y0 + m.j0 * r.res, r.y0 + (m.j0 + m.h) * r.res); }
  for (const p of D.spur) { xs.push(p[0]); ys.push(p[1]); }
  const xmin = Math.min(...xs) - 80, xmax = Math.max(...xs) + 80, ymin = Math.min(...ys) - 80, ymax = Math.max(...ys) + 80;
  const s = Math.min(W / (ymax - ymin), H / (xmax - xmin));
  const P = (x, y) => [W / 2 - (y - (ymin + ymax) / 2) * s, H / 2 - (x - (xmin + xmax) / 2) * s];
  if (r && D.map) {
    const m = D.map, key = D.lauf + ':' + m.i0 + ':' + m.j0 + ':' + m.b64.length + ':' + m.b64.slice(-40);
    if (key !== mapKey) { mapImg = decodeMap(m); mapKey = key; }
    const [ax, ay] = P(r.x0 + m.i0 * r.res, r.y0 + m.j0 * r.res), k = r.res * s;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(ax, ay); ctx.transform(0, -k, -k, 0, 0, 0); ctx.drawImage(mapImg, 0, 0); ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.05)'; ctx.lineWidth = 1;
  for (let g = Math.ceil(xmin / 180) * 180; g < xmax; g += 180) { ctx.beginPath(); ctx.moveTo(...P(g, ymin)); ctx.lineTo(...P(g, ymax)); ctx.stroke(); }
  for (let g = Math.ceil(ymin / 180) * 180; g < ymax; g += 180) { ctx.beginPath(); ctx.moveTo(...P(xmin, g)); ctx.lineTo(...P(xmax, g)); ctx.stroke(); }
  ctx.strokeStyle = '#1f7fbf'; ctx.lineWidth = 3; ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath();
  D.spur.forEach((p, k) => { const q = P(p[0], p[1]); k ? ctx.lineTo(...q) : ctx.moveTo(...q); }); ctx.stroke();
  if (D.weg.length) {
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.setLineDash([2, 7]); ctx.lineWidth = 3; ctx.beginPath();
    if (D.pose) ctx.moveTo(...P(D.pose.x, D.pose.y));
    D.weg.forEach(p => ctx.lineTo(...P(p[0], p[1]))); ctx.stroke(); ctx.setLineDash([]);
    const g = P(...D.weg[D.weg.length - 1]);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(g[0], g[1], 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(g[0], g[1], 2.5, 0, 7); ctx.fill();
  }
  const fahrt = D.pose && Date.now() - D.pose.t < 2000;
  const p = D.pose || { x:0, y:0, th:0 };
  const tof = fahrt ? D.pose.tof : (D.status && Date.now() - D.statusT < 2000 ? D.status.t : null);
  const c = Math.cos(p.th), sn = Math.sin(p.th);
  const neu = tof && tof !== letzteT; letzteT = tof;
  if (tof) MOUNT.forEach((m, k) => {
    const mm = neu ? beruhigt(k, tof[k]) : (frei[k] ? null : zeige[k]);
    const nix = mm == null, len = nix ? 1200 : Math.max(0, zeige[k] - 12);
    const a = p.th + m[2] * Math.PI / 180, sx = p.x + m[0] * c - m[1] * sn, sy = p.y + m[0] * sn + m[1] * c;
    const o = P(sx, sy), pts = [];
    for (let t = -HALF; t <= HALF + 1e-6; t += HALF / 8) pts.push(P(sx + len * Math.cos(a + t), sy + len * Math.sin(a + t)));
    ctx.beginPath(); ctx.moveTo(...o); pts.forEach(q => ctx.lineTo(...q)); ctx.closePath();
    ctx.fillStyle = nix ? 'rgba(117,193,240,.10)' : 'rgba(117,193,240,.32)'; ctx.fill();
    if (!nix) {
      ctx.strokeStyle = '#75C1F0'; ctx.lineWidth = 3; ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(...q) : ctx.moveTo(...q)); ctx.stroke();
      const t = P(sx + (len + 45) * Math.cos(a), sy + (len + 45) * Math.sin(a));
      ctx.fillStyle = '#000'; ctx.font = '600 12px Figtree, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.max(0, Math.round((zeige[k] - 12) / 10)) + ' cm', t[0], t[1]);
    }
  });
  const sq = [];
  for (let t = 0; t < 2 * Math.PI; t += Math.PI / 32) { const ct = Math.cos(t), st = Math.sin(t);
    const x = 44 * Math.sign(ct) * Math.abs(ct) ** (2 / 3), y = 44 * Math.sign(st) * Math.abs(st) ** (2 / 3);
    sq.push(P(p.x + x * c - y * sn, p.y + x * sn + y * c)); }
  ctx.fillStyle = '#000'; ctx.beginPath(); sq.forEach((q, i) => i ? ctx.lineTo(...q) : ctx.moveTo(...q)); ctx.closePath(); ctx.fill();
  const n0 = P(p.x + 10 * c, p.y + 10 * sn), n1 = P(p.x + 34 * c, p.y + 34 * sn);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...n0); ctx.lineTo(...n1); ctx.stroke();
}

// ---------- Akku (LiPo 1S, ungefähr) ----------
const KURVE = [[3.30,0],[3.50,5],[3.60,12],[3.70,28],[3.75,38],[3.80,47],[3.90,63],[4.00,78],[4.10,90],[4.20,100]];
let vGlatt = null, pctZeige = null;
function akku(v) {
  if (!v || v < 1) { $('akkup').textContent = v < 1 ? 'aus' : '–'; return; }
  vGlatt = vGlatt == null || Math.abs(v - vGlatt) > 0.15 ? v : vGlatt + 0.05 * (v - vGlatt);
  let pct = 0;
  for (let k = 1; k < KURVE.length; k++) { const [v0, p0] = KURVE[k-1], [v1, p1] = KURVE[k];
    if (vGlatt >= v1) pct = p1; else if (vGlatt > v0) { pct = p0 + (p1 - p0) * (vGlatt - v0) / (v1 - v0); break; } else break; }
  if (pctZeige == null || Math.abs(pct - pctZeige) >= 2) pctZeige = Math.round(pct);
  $('akkup').textContent = pctZeige + ' %';
  $('akku').title = v.toFixed(2) + ' V';
  const w = 21.3 * Math.max(0.08, pctZeige / 100);
  $('battlvl').setAttribute('d', `M3.6 2.7h${w.toFixed(1)}a.9.9 0 0 1 .9.9v6a.9.9 0 0 1-.9.9H3.6a.9.9 0 0 1-.9-.9v-6a.9.9 0 0 1 .9-.9z`);
  document.querySelector('.batt').classList.toggle('leer', pctZeige < 15);
}

(function loop() { anzeigen(); draw(); setTimeout(loop, 100); })();
</script>
